name = "mysun-demo"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "c53b147ee4dff886f6e1e733cb85adea"

# The public demo hostname is intercepted at Cloudflare's edge by this worker
# (no DNS change needed): static frontend assets always serve; /rpc proxies to
# the home tunnel (chain.mysun.dev) which is only up while the Mac is on.
routes = [
  { pattern = "demo.mysun.dev/*", zone_name = "mysun.dev" }
]

# binding=ASSETS is required for env.ASSETS to exist; not_found_handling is
# applied by the binding, so unmatched GETs fall back to index.html (SPA).
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
